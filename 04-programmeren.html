<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Programmeren: robot op pad | ICT Missie</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="code">
<main class="shell">
  <div class="top">
    <a class="logo" href="index.html"><img src="https://ict-missie-ter-aa.chatgpt-werk-1869.chatgpt.site/ter-aa-logo.png" alt="Ter AA"></a>
    <div class="step">4 van 4</div>
  </div>

  <section class="card">
    <div class="chapter-head">
      <div class="chapter-kicker"><span>🤖</span>Programmeren</div>
      <h1>Programmeren: robot op pad</h1>
    </div>

    <div class="progress"><span id="progress"></span></div>
    <div id="number"></div>
    <div id="story"></div>
    <div id="question"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <div id="taskarea"></div>
    <button class="primary" id="next" hidden>Volgende</button>
  </section>

  <div class="footer">ICT College · Ter AA</div>
</main>

<script>
const items = [["De robot moet drie vakjes vooruit naar de sleutel.", "Welke instructie is het duidelijkst?", ["Vooruit, vooruit, vooruit", "Doe iets slims", "Ga ongeveer daarheen"], 0, "Programmeren vraagt om concrete instructies."], ["De robot staat voor een muur.", "Wat is slim vóór hij vooruit gaat?", ["Controleren of het vak vrij is", "Altijd vooruit blijven gaan", "De sleutel verwijderen"], 0, "Voorwaarden laten een programma beslissen."], ["TASK", "Doe-opdracht", ["Eén leerling is de robot. De ander geeft exact vier commando's om een denkbeeldige sleutel te bereiken."], 0, ""], ["Dezelfde stap moet vijf keer worden uitgevoerd.", "Wat voorkomt veel herhaling?", ["Een lus", "Een screenshot", "Een wachtwoord"], 0, "Een lus herhaalt instructies."], ["De robot rijdt de verkeerde kant op.", "Wat doe je?", ["De stappen één voor één controleren", "Alles wissen zonder te kijken", "De robot de schuld geven"], 0, "Dat is debuggen: systematisch fouten zoeken."], ["TASK", "Doe-opdracht", ["Beschrijf in maximaal zes stappen hoe iemand van een stoel naar de deur loopt, zo precies dat een robot het begrijpt."], 0, ""], ["Je code werkt alleen als er geen obstakel staat.", "Wat voeg je toe?", ["Een voorwaarde", "Meer hoofdletters", "Een langere bestandsnaam"], 0, "Met voorwaarden kan code anders reageren op situaties."], ["De robot bereikt de sleutel.", "Wat doe je vóór je zegt dat het programma klaar is?", ["Testen in meerdere situaties", "Alleen kijken of de code mooi is", "De computer uitzetten"], 0, "Goede software wordt getest."]];
const digit = "7";
const nextFile = "finale.html";
const nextLabel = "Naar de finale";
let current = 0;

const number = document.getElementById("number");
const story = document.getElementById("story");
const question = document.getElementById("question");
const choices = document.getElementById("choices");
const feedback = document.getElementById("feedback");
const taskarea = document.getElementById("taskarea");
const next = document.getElementById("next");
const progress = document.getElementById("progress");

function render(){
  progress.style.width = ((current / items.length) * 100) + "%";
  feedback.textContent = "";
  taskarea.innerHTML = "";
  choices.innerHTML = "";
  next.hidden = true;

  if(current >= items.length){
    progress.style.width = "100%";
    number.textContent = "Hoofdstuk afgerond";
    story.innerHTML = "Bewaar dit cijfer voor de eindcode.";
    question.textContent = "";
    choices.innerHTML = "";
    feedback.textContent = "";
    taskarea.innerHTML = `<div class="codebox"><div>Jouw cijfer</div><div class="digit">${digit}</div></div>`;
    next.textContent = nextLabel;
    next.hidden = false;
    next.onclick = () => location.href = nextFile;
    return;
  }

  const x = items[current];
  number.textContent = `Onderdeel ${current+1} van ${items.length}`;

  if(x[0] === "TASK"){
    story.textContent = "Jullie opdracht";
    question.textContent = x[1];
    taskarea.innerHTML = `<textarea placeholder="Schrijf hier eventueel jullie antwoord..."></textarea>`;
    const note = document.createElement("div");
    note.className = "note";
    note.style.marginTop = "10px";
    note.textContent = x[2][0];
    taskarea.appendChild(note);
    next.textContent = "Opdracht klaar";
    next.hidden = false;
    next.onclick = advance;
    return;
  }

  story.textContent = x[0];
  question.textContent = x[1];

  x[2].forEach((answer, idx) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = answer;
    b.onclick = () => checkAnswer(idx, b);
    choices.appendChild(b);
  });
}

function checkAnswer(idx, button){
  const x = items[current];
  if(idx === x[3]){
    button.classList.add("good");
    feedback.textContent = "Goed. " + x[4];
    [...choices.children].forEach(b => b.disabled = true);
    next.textContent = "Volgende";
    next.hidden = false;
    next.onclick = advance;
  } else {
    button.classList.add("bad");
    feedback.textContent = "Nog niet. " + x[4] + " Probeer dezelfde vraag opnieuw.";
  }
}

function advance(){
  current++;
  render();
}

render();
</script>
</body>
</html>
